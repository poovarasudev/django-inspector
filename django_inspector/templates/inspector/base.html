{% load inspector_tags %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inspector{% endblock %}</title>
    <link rel="stylesheet" href="{% url 'inspector:asset' 'inspector.css' %}?v={% inspector_version %}">
    <script src="{% url 'inspector:asset' 'htmx.min.js' %}?v=2.0.4"></script>
    <script src="{% url 'inspector:asset' 'inspector.js' %}?v={% inspector_version %}" defer></script>
</head>
<body>
    <div class="inspector-layout">
        {% include "inspector/_sidebar.html" %}
        <main class="inspector-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
