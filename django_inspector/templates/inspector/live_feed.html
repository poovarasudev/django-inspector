{% extends "inspector/base.html" %}
{% block title %}Live Feed — Inspector{% endblock %}
{% block content %}
<div class="inspector-page-header">
    <h1>Live Feed</h1>
    <button type="button" id="pause-btn" class="inspector-btn" data-inspector-toggle-polling="feed-table">&#9208; Pause</button>
</div>
<div id="feed-table"
     hx-get="{% url 'inspector:live-feed' %}"
     hx-trigger="every 3s"
     hx-swap="innerHTML"
     hx-push-url="false">
    {% include "inspector/_live_feed_table.html" %}
</div>
{% include "inspector/_pagination.html" %}
{% endblock %}
