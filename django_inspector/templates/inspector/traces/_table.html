<table class="inspector-table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Duration</th>
            <th>Time</th>
        </tr>
    </thead>
    <tbody>
        {% for event in page.object_list %}
        <tr>
            <td><a href="{% url 'inspector:trace-detail' event.trace_id %}">{{ event.metadata.name }}</a></td>
            <td>
                <a href="{% url 'inspector:trace-detail' event.trace_id %}">
                    <span class="inspector-badge {% if event.metadata.status == 'ok' %}inspector-badge--2xx{% else %}inspector-badge--5xx{% endif %}">{{ event.metadata.status }}</span>
                </a>
            </td>
            <td><a href="{% url 'inspector:trace-detail' event.trace_id %}">{{ event.metadata.duration_ms|floatformat:2 }}ms</a></td>
            <td>{{ event.timestamp|timesince }} ago {% if event.pinned %}<span class="inspector-badge inspector-badge--pinned">Pinned</span>{% endif %}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" style="text-align: center; padding: 40px; color: var(--ins-text-secondary);">No traces found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
